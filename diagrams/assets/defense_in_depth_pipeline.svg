<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
    </defs>

    <rect width="1000" height="560" rx="12" fill="#0f172a" />
    <text x="500" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Multi-Paradigm Defense-in-Depth Surveillance Pipeline</text>
    <text x="500" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Simultaneous 5-model concurrent evaluation with weighted ensemble fusion</text>

    <!-- Ingestion Stage -->
    <g transform="translate(40, 90)">
        <rect width="180" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
        <text x="90" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Incoming Tx (REST API)</text>
        <text x="90" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">JSON Ingestion Payload</text>
    </g>

    <path d="M 220 125 L 260 125" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Feature Engineering -->
    <g transform="translate(270, 90)">
        <rect width="200" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
        <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">9-Feature Transformer</text>
        <text x="100" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Balance Deltas error_orig/dest</text>
    </g>

    <!-- Branch lines to 5 Engines -->
    <path d="M 470 125 L 520 125 L 520 220 L 550 220" fill="none" stroke="#3b82f6" stroke-width="2" />
    <path d="M 520 220 L 520 140 L 550 140" fill="none" stroke="#3b82f6" stroke-width="2" />
    <path d="M 520 220 L 520 300 L 550 300" fill="none" stroke="#3b82f6" stroke-width="2" />
    <path d="M 520 220 L 520 380 L 550 380" fill="none" stroke="#3b82f6" stroke-width="2" />
    <path d="M 520 220 L 520 460 L 550 460" fill="none" stroke="#3b82f6" stroke-width="2" />

    <!-- 5 Model Engines -->
    <!-- Engine 1 -->
    <g transform="translate(560, 110)">
        <rect width="210" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1. Heuristic Rules (w = 0.50)</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Statutory currency thresholds</text>
    </g>
    <!-- Engine 2 -->
    <g transform="translate(560, 190)">
        <rect width="210" height="60" rx="6" fill="#1e293b" stroke="#2563eb" stroke-width="2" />
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">2. XGBoost Trees (w = 1.00)</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Supervised PaySim classification</text>
    </g>
    <!-- Engine 3 -->
    <g transform="translate(560, 270)">
        <rect width="210" height="60" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" />
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">3. Isolation Forest (w = 0.85)</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Multi-dimensional geometric outliers</text>
    </g>
    <!-- Engine 4 -->
    <g transform="translate(560, 350)">
        <rect width="210" height="60" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1.5" />
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">4. Deep Autoencoder (w = 0.80)</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Latent representation MSE</text>
    </g>
    <!-- Engine 5 -->
    <g transform="translate(560, 430)">
        <rect width="210" height="60" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">5. NetworkX Graph (w = 0.90)</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Circular loop &amp; mule detection</text>
    </g>

    <!-- Converge lines to Fusion -->
    <path d="M 770 140 L 800 140 L 800 290 L 830 290" fill="none" stroke="#64748b" stroke-width="2" />
    <path d="M 770 220 L 800 220 L 800 290" fill="none" stroke="#2563eb" stroke-width="2" />
    <path d="M 770 300 L 830 300" fill="none" stroke="#7c3aed" stroke-width="2" />
    <path d="M 770 380 L 800 380 L 800 300" fill="none" stroke="#d97706" stroke-width="2" />
    <path d="M 770 460 L 800 460 L 800 310 L 830 310" fill="none" stroke="#059669" stroke-width="2" />

    <!-- Fusion & Triage Box -->
    <g transform="translate(830, 240)" filter="url(#dropShadow)">
        <rect width="140" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="70" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Weighted Fusion</text>
        <text x="70" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">R = sum(w_i * s_i)</text>
        <line x1="15" y1="58" x2="125" y2="58" stroke="#334155" stroke-width="1" />
        <text x="15" y="75" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ef4444">• High: R &gt;= 0.70</text>
        <text x="15" y="92" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f59e0b">• Med: R &gt;= 0.40</text>
        <text x="15" y="108" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#10b981">• Low: R &lt; 0.40</text>
    </g>

    <!-- Bottom Latency Banner -->
    <g transform="translate(40, 500)">
        <rect width="920" height="36" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="460" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Real-Time Synchronous Execution: Average Latency = 11.20 ms across all 5 models</text>
    </g>
</svg>