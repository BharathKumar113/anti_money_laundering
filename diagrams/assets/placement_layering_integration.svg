<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
    </defs>

    <rect width="960" height="340" rx="12" fill="#0f172a" />
    <text x="480" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">The Three Fundamental Stages of Money Laundering</text>
    <text x="480" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">The lifecycle through which illicit funds are integrated into the formal economy</text>

    <!-- Stage 1 -->
    <g transform="translate(40, 100)" filter="url(#dropShadow)">
        <rect width="250" height="190" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
        <rect width="250" height="40" rx="10" fill="url(#blueGrad)" />
        <text x="125" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1. PLACEMENT</text>
        <text x="125" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">Cash Entry into System</text>
        <text x="20" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Structured sub-threshold cash</text>
        <text x="20" y="122" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• "Smurfing" runners and mules</text>
        <text x="20" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Blended retail business sales</text>
        <text x="20" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Digital wallet cash deposits</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 305 195 L 345 195" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" />
    <text x="325" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">Layer</text>

    <!-- Stage 2 -->
    <g transform="translate(355, 100)" filter="url(#dropShadow)">
        <rect width="250" height="190" rx="10" fill="#1e293b" stroke="#d97706" stroke-width="2" />
        <rect width="250" height="40" rx="10" fill="url(#amberGrad)" />
        <text x="125" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2. LAYERING</text>
        <text x="125" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fcd34d">Audit Trail Obfuscation</text>
        <text x="20" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Multi-hop account transfers</text>
        <text x="20" y="122" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Circular loops ("Round-Tripping")</text>
        <text x="20" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Cross-border offshore wires</text>
        <text x="20" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Rapid account balance drains</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 620 195 L 660 195" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)" />
    <text x="640" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Integrate</text>

    <!-- Stage 3 -->
    <g transform="translate(670, 100)" filter="url(#dropShadow)">
        <rect width="250" height="190" rx="10" fill="#1e293b" stroke="#059669" stroke-width="2" />
        <rect width="250" height="40" rx="10" fill="url(#emeraldGrad)" />
        <text x="125" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3. INTEGRATION</text>
        <text x="125" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">Legitimate Re-entry</text>
        <text x="20" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Real estate asset purchases</text>
        <text x="20" y="122" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Corporate shell acquisitions</text>
        <text x="20" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Commercial invoice settlements</text>
        <text x="20" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Clean wealth generation</text>
    </g>
</svg>