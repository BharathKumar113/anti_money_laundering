<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
    
    <defs>
        <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.08" />
        </filter>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="umlInh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
        </marker>
    </defs>

    <rect width="880" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="440" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">UML State Machine Diagram: Compliance Alert Lifecycle</text>
    <text x="440" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Standard UML state transitions from transaction ingestion to investigative disposition and SAR filing</text>

    <!-- Initial State -->
    <circle cx="50" cy="180" r="14" fill="#0f172a" />
    <line x1="64" y1="180" x2="105" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrowSlate)" />

    <!-- State 1: Ingested -->
    <g transform="translate(110, 150)">
        <rect width="130" height="60" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
        <text x="65" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">INGESTED</text>
    </g>

    <!-- Branch 1: Low Risk -> Cleared -->
    <path d="M 175 150 L 175 100 L 290 100" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
    <text x="230" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">[Score &lt; 0.40]</text>

    <!-- State: Cleared -->
    <g transform="translate(295, 75)">
        <rect width="150" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
        <text x="75" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#065f46">CLEARED</text>
        <text x="75" y="43" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#047857">Straight-Through Processing</text>
    </g>

    <!-- Final State 1 -->
    <circle cx="500" cy="100" r="14" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <circle cx="500" cy="100" r="8" fill="#059669" />
    <line x1="445" y1="100" x2="483" y2="100" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Branch 2: Suspicious -> Pending Alert -->
    <line x1="240" y1="180" x2="290" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" />
    <text x="265" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#dc2626">[Score &gt;= 0.40]</text>

    <!-- State 2: Pending Alert -->
    <g transform="translate(295, 150)">
        <rect width="150" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
        <text x="75" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">PENDING_ALERT</text>
        <text x="75" y="46" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">Severity: HIGH / MED</text>
    </g>

    <!-- Transition: Claim Case -->
    <line x1="445" y1="180" x2="505" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)" />
    <text x="475" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Claim</text>

    <!-- State 3: Under Investigation -->
    <g transform="translate(510, 150)">
        <rect width="160" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
        <text x="80" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">INVESTIGATION</text>
        <text x="80" y="46" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3b82f6">Examine SHAP &amp; Graph</text>
    </g>

    <!-- Branch A: False Positive -->
    <path d="M 590 210 L 590 270 L 710 270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)" />
    <text x="645" y="262" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">[Benign Rationale]</text>

    <!-- State: Dismissed -->
    <g transform="translate(715, 245)">
        <rect width="130" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <text x="65" y="28" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155">FALSE_POSITIVE</text>
        <text x="65" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Audit Note Stored</text>
    </g>

    <!-- Branch B: Confirmed Fraud -> SAR -->
    <line x1="670" y1="180" x2="710" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" />
    <text x="690" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#dc2626">[Fraud]</text>

    <!-- State: SAR Filed -->
    <g transform="translate(715, 150)">
        <rect width="130" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
        <text x="65" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">SAR_FILED</text>
        <text x="65" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b91c1c">Report Sent to FIU</text>
    </g>

    <!-- Final State for SAR -->
    <circle cx="865" cy="180" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <circle cx="865" cy="180" r="8" fill="#dc2626" />
    <line x1="845" y1="180" x2="851" y2="180" stroke="#dc2626" stroke-width="2" />

    <!-- Final State for False Positive -->
    <circle cx="865" cy="270" r="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle cx="865" cy="270" r="8" fill="#64748b" />
    <line x1="845" y1="270" x2="851" y2="270" stroke="#64748b" stroke-width="2" />
</svg>