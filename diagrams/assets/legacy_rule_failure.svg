<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
    </defs>

    <rect width="960" height="380" rx="12" fill="#0f172a" />
    <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Anatomy of Traditional Rule-Based System Failure</text>
    <text x="480" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Why legacy commercial suites produce 95%+ false positives and miss structured networks</text>

    <!-- Core Banking Box -->
    <g transform="translate(40, 100)">
        <rect width="180" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Core Banking</text>
        <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">OLTP Database</text>
        <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">100k+ Transactions/day</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 220 145 L 265 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />
    <text x="242" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">T+1 Batch</text>

    <!-- Data Warehouse -->
    <g transform="translate(275, 100)">
        <rect width="180" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Data Warehouse</text>
        <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Nightly ETL Staging</text>
        <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">24-48h Latency Lag</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 455 145 L 500 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />
    <text x="477" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Execute</text>

    <!-- Static Rule Engine -->
    <g transform="translate(510, 100)">
        <rect width="180" height="90" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="2" />
        <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">Rule Engine</text>
        <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Static SQL Thresholds</text>
        <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">Amount &gt; $10k, Delta &gt; 80%</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 690 145 L 735 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />

    <!-- Unfiltered Alerts -->
    <g transform="translate(745, 100)">
        <rect width="175" height="90" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="2" />
        <text x="87" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">5,000+ Daily Alerts</text>
        <text x="87" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444">Excessive Volume</text>
        <text x="87" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Overwhelmed Queue</text>
    </g>

    <!-- Triage Branches -->
    <path d="M 832 190 L 832 230 L 760 230" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 832 190 L 832 300 L 760 300" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Branch 1: False Positives -->
    <g transform="translate(450, 210)">
        <rect width="300" height="50" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.5" />
        <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">95% False Positives (Harmless Normal Tx)</text>
        <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#fecaca">Dismissed without action • Massive analyst fatigue</text>
    </g>

    <!-- Branch 2: True Positives -->
    <g transform="translate(450, 280)">
        <rect width="300" height="50" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
        <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">5% True Positives (Actual Laundering)</text>
        <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">Manual SAR filed 48-72h late (Funds already gone)</text>
    </g>

    <!-- Fatal Blindspots Callout -->
    <g transform="translate(40, 220)">
        <rect width="380" height="120" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
        <text x="20" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Structural Vulnerabilities of Existing Systems:</text>
        <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Smurfing: $9,800 transfers bypass the $10,000 static rule</text>
        <text x="20" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Relational Blindness: Fails to correlate multi-account circular loops</text>
        <text x="20" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• $206B Annual Global Compliance Cost with &lt; 1% recovery</text>
    </g>
</svg>