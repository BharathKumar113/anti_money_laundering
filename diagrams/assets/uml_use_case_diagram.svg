<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
    
    <defs>
        <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.08" />
        </filter>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="umlInh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
        </marker>
    </defs>

    <rect width="880" height="440" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="440" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">UML Use Case Diagram: Anti-Money Laundering Platform</text>
    <text x="440" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Primary actors and core capabilities of the AML Surveillance &amp; Triage System</text>

    <!-- Boundary Box -->
    <rect x="220" y="70" width="440" height="345" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" />
    <text x="440" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">AML Surveillance Platform Boundary</text>

    <!-- Actor 1: Banking Core System (Left) -->
    <g transform="translate(40, 160)">
        <circle cx="50" cy="30" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
        <line x1="50" y1="45" x2="50" y2="80" stroke="#2563eb" stroke-width="2" />
        <line x1="25" y1="58" x2="75" y2="58" stroke="#2563eb" stroke-width="2" />
        <line x1="50" y1="80" x2="30" y2="105" stroke="#2563eb" stroke-width="2" />
        <line x1="50" y1="80" x2="70" y2="105" stroke="#2563eb" stroke-width="2" />
        <text x="50" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Banking Core</text>
        <text x="50" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">(Client System)</text>
    </g>

    <!-- Actor 2: Compliance Officer (Right Top) -->
    <g transform="translate(740, 110)">
        <circle cx="50" cy="30" r="15" fill="#ffffff" stroke="#059669" stroke-width="2" />
        <line x1="50" y1="45" x2="50" y2="80" stroke="#059669" stroke-width="2" />
        <line x1="25" y1="58" x2="75" y2="58" stroke="#059669" stroke-width="2" />
        <line x1="50" y1="80" x2="30" y2="105" stroke="#059669" stroke-width="2" />
        <line x1="50" y1="80" x2="70" y2="105" stroke="#059669" stroke-width="2" />
        <text x="50" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Compliance Officer</text>
        <text x="50" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">(AML Investigator)</text>
    </g>

    <!-- Actor 3: System Administrator (Right Bottom) -->
    <g transform="translate(740, 275)">
        <circle cx="50" cy="25" r="14" fill="#ffffff" stroke="#d97706" stroke-width="2" />
        <line x1="50" y1="39" x2="50" y2="70" stroke="#d97706" stroke-width="2" />
        <line x1="28" y1="50" x2="72" y2="50" stroke="#d97706" stroke-width="2" />
        <line x1="50" y1="70" x2="32" y2="92" stroke="#d97706" stroke-width="2" />
        <line x1="50" y1="70" x2="68" y2="92" stroke="#d97706" stroke-width="2" />
        <text x="50" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">System Admin</text>
        <text x="50" y="126" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">(ML Engineer)</text>
    </g>

    <!-- 6 Clean Ovals for Use Cases -->
    <!-- UC1 -->
    <g transform="translate(250, 110)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Submit Single Transaction</text>
    </g>
    <!-- UC2 -->
    <g transform="translate(250, 160)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Upload PaySim CSV Stream</text>
    </g>
    <!-- UC3 -->
    <g transform="translate(250, 215)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Execute 5-Model Scoring</text>
    </g>

    <!-- UC4 -->
    <g transform="translate(460, 110)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">View Live KPI Dashboard</text>
    </g>
    <!-- UC5 -->
    <g transform="translate(460, 160)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Trace Network Graph Loops</text>
    </g>
    <!-- UC6 -->
    <g transform="translate(460, 215)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Resolve Alerts &amp; File SAR</text>
    </g>

    <!-- UC7 -->
    <g transform="translate(355, 290)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Toggle Plugins On/Off</text>
    </g>
    <!-- UC8 -->
    <g transform="translate(355, 345)">
        <ellipse cx="95" cy="22" rx="85" ry="18" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Rebalance Model Weights</text>
    </g>

    <!-- Connector Lines -->
    <!-- Banking Core -> UC1, UC2 -->
    <line x1="120" y1="210" x2="250" y2="132" stroke="#64748b" stroke-width="1.5" />
    <line x1="120" y1="210" x2="250" y2="182" stroke="#64748b" stroke-width="1.5" />
    <line x1="345" y1="132" x2="345" y2="215" stroke="#94a3b8" stroke-dasharray="3 3" />
    <line x1="345" y1="182" x2="345" y2="215" stroke="#94a3b8" stroke-dasharray="3 3" />

    <!-- Compliance Officer -> UC4, UC5, UC6 -->
    <line x1="740" y1="160" x2="650" y2="132" stroke="#64748b" stroke-width="1.5" />
    <line x1="740" y1="160" x2="650" y2="182" stroke="#64748b" stroke-width="1.5" />
    <line x1="740" y1="160" x2="650" y2="237" stroke="#64748b" stroke-width="1.5" />

    <!-- Admin -> UC7, UC8 -->
    <line x1="740" y1="320" x2="545" y2="312" stroke="#64748b" stroke-width="1.5" />
    <line x1="740" y1="320" x2="545" y2="367" stroke="#64748b" stroke-width="1.5" />
</svg>