<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
    
    <defs>
        <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.08" />
        </filter>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="umlInh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
        </marker>
    </defs>

    <rect width="920" height="540" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="460" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">UML Class Diagram: Domain Models &amp; Plugin Hierarchy</text>
    <text x="460" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Standard UML 3-compartment representations showing inheritance, registry aggregation, and data entities</text>

    <!-- Top: BaseAMLModelPlugin (Abstract) -->
    <g transform="translate(330, 70)">
        <rect width="260" height="110" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
        <rect width="260" height="26" rx="4" fill="#eff6ff" />
        <text x="130" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e40af">&lt;&lt;abstract&gt;&gt; BaseAMLModelPlugin</text>
        <text x="12" y="44" font-family="monospace" font-size="10" fill="#334155">+name: str, version: str, author: str</text>
        <text x="12" y="58" font-family="monospace" font-size="10" fill="#334155">+is_enabled: bool, weight: float</text>
        <line x1="0" y1="68" x2="260" y2="68" stroke="#cbd5e1" />
        <text x="12" y="86" font-family="monospace" font-size="10" font-weight="700" fill="#1e40af">+predict(tx: dict): PluginPrediction*</text>
        <text x="12" y="100" font-family="monospace" font-size="9" fill="#64748b">#_track_latency(t0: float): float</text>
    </g>

    <!-- 5 Subclasses Row -->
    <!-- 1. XGBoost -->
    <g transform="translate(30, 220)">
        <rect width="155" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
        <rect width="155" height="22" rx="4" fill="#f1f5f9" />
        <text x="77" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">XGBoostPlugin</text>
        <text x="8" y="38" font-family="monospace" font-size="9" fill="#475569">+model: Booster</text>
        <line x1="0" y1="44" x2="155" y2="44" stroke="#e2e8f0" />
        <text x="8" y="58" font-family="monospace" font-size="9" fill="#0f172a">+predict(tx)</text>
    </g>

    <!-- 2. Autoencoder -->
    <g transform="translate(205, 220)">
        <rect width="155" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
        <rect width="155" height="22" rx="4" fill="#f1f5f9" />
        <text x="77" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">AutoencoderPlugin</text>
        <text x="8" y="38" font-family="monospace" font-size="9" fill="#475569">+bundle: dict</text>
        <line x1="0" y1="44" x2="155" y2="44" stroke="#e2e8f0" />
        <text x="8" y="58" font-family="monospace" font-size="9" fill="#0f172a">+predict(tx)</text>
    </g>

    <!-- 3. Isolation Forest -->
    <g transform="translate(380, 220)">
        <rect width="155" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
        <rect width="155" height="22" rx="4" fill="#f1f5f9" />
        <text x="77" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">IsolationForestPlugin</text>
        <text x="8" y="38" font-family="monospace" font-size="9" fill="#475569">+model: IsoForest</text>
        <line x1="0" y1="44" x2="155" y2="44" stroke="#e2e8f0" />
        <text x="8" y="58" font-family="monospace" font-size="9" fill="#0f172a">+predict(tx)</text>
    </g>

    <!-- 4. Graph Ring -->
    <g transform="translate(555, 220)">
        <rect width="155" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
        <rect width="155" height="22" rx="4" fill="#f1f5f9" />
        <text x="77" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">GraphRingPlugin</text>
        <text x="8" y="38" font-family="monospace" font-size="9" fill="#475569">+weight = 0.90</text>
        <line x1="0" y1="44" x2="155" y2="44" stroke="#e2e8f0" />
        <text x="8" y="58" font-family="monospace" font-size="9" fill="#0f172a">+predict(tx)</text>
    </g>

    <!-- 5. Heuristic Rules -->
    <g transform="translate(730, 220)">
        <rect width="155" height="70" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
        <rect width="155" height="22" rx="4" fill="#f1f5f9" />
        <text x="77" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">HeuristicRulePlugin</text>
        <text x="8" y="38" font-family="monospace" font-size="9" fill="#475569">+weight = 0.50</text>
        <line x1="0" y1="44" x2="155" y2="44" stroke="#e2e8f0" />
        <text x="8" y="58" font-family="monospace" font-size="9" fill="#0f172a">+predict(tx)</text>
    </g>

    <!-- Generalization Connector (Tree) -->
    <line x1="107" y1="220" x2="107" y2="200" stroke="#475569" stroke-width="1.5" />
    <line x1="282" y1="220" x2="282" y2="200" stroke="#475569" stroke-width="1.5" />
    <line x1="457" y1="220" x2="457" y2="200" stroke="#475569" stroke-width="1.5" />
    <line x1="632" y1="220" x2="632" y2="200" stroke="#475569" stroke-width="1.5" />
    <line x1="807" y1="220" x2="807" y2="200" stroke="#475569" stroke-width="1.5" />
    <line x1="107" y1="200" x2="807" y2="200" stroke="#475569" stroke-width="1.5" />
    <line x1="460" y1="200" x2="460" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#umlInh)" />

    <!-- Bottom Row: Registry, Transaction, Alert -->
    <!-- Registry -->
    <g transform="translate(40, 340)">
        <rect width="250" height="150" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
        <rect width="250" height="24" rx="4" fill="#eff6ff" />
        <text x="125" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e40af">ModelPluginRegistry</text>
        <text x="10" y="44" font-family="monospace" font-size="9" fill="#334155">-plugins: dict[str, BasePlugin]</text>
        <line x1="0" y1="52" x2="250" y2="52" stroke="#e2e8f0" />
        <text x="10" y="70" font-family="monospace" font-size="9" fill="#0f172a">+register_plugin(plugin)</text>
        <text x="10" y="86" font-family="monospace" font-size="9" fill="#0f172a">+toggle_plugin(name, enabled)</text>
        <text x="10" y="102" font-family="monospace" font-size="9" fill="#0f172a">+update_weight(name, weight)</text>
        <text x="10" y="118" font-family="monospace" font-size="9" font-weight="700" fill="#2563eb">+execute_ensemble(tx): Result</text>
        <text x="10" y="134" font-family="monospace" font-size="9" fill="#64748b">+get_all_plugins(): list</text>
    </g>

    <!-- Diamond Aggregation Line from Registry to BasePlugin -->
    <line x1="290" y1="390" x2="350" y2="390" stroke="#475569" stroke-width="1.5" />
    <line x1="350" y1="390" x2="350" y2="180" stroke="#475569" stroke-width="1.5" />
    <polygon points="290,390 298,386 306,390 298,394" fill="#ffffff" stroke="#475569" stroke-width="1.5" />

    <!-- Transaction Entity -->
    <g transform="translate(340, 340)">
        <rect width="260" height="150" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
        <rect width="260" height="24" rx="4" fill="#ecfdf5" />
        <text x="130" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46">Transaction (Entity)</text>
        <text x="10" y="44" font-family="monospace" font-size="9" fill="#334155">+id: UUID (PK)</text>
        <text x="10" y="58" font-family="monospace" font-size="9" fill="#334155">+amount: float, type: str</text>
        <text x="10" y="72" font-family="monospace" font-size="9" fill="#334155">+name_orig: str, name_dest: str</text>
        <text x="10" y="86" font-family="monospace" font-size="9" fill="#334155">+old_balance_orig, new_balance_orig</text>
        <text x="10" y="100" font-family="monospace" font-size="9" font-weight="700" fill="#059669">+risk_score: float, is_suspicious: bool</text>
        <text x="10" y="114" font-family="monospace" font-size="9" fill="#334155">+flag_reasons: list, shap_values: dict</text>
        <line x1="0" y1="122" x2="260" y2="122" stroke="#e2e8f0" />
        <text x="10" y="138" font-family="monospace" font-size="9" fill="#64748b">+to_dict(): dict</text>
    </g>

    <!-- Alert Entity -->
    <g transform="translate(660, 340)">
        <rect width="230" height="150" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
        <rect width="230" height="24" rx="4" fill="#fef2f2" />
        <text x="115" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">Alert (Entity)</text>
        <text x="10" y="44" font-family="monospace" font-size="9" fill="#334155">+id: int (PK)</text>
        <text x="10" y="58" font-family="monospace" font-size="9" fill="#334155">+transaction_id: UUID (FK)</text>
        <text x="10" y="72" font-family="monospace" font-size="9" font-weight="700" fill="#dc2626">+severity: HIGH | MEDIUM</text>
        <text x="10" y="86" font-family="monospace" font-size="9" fill="#334155">+status: PENDING | RESOLVED</text>
        <text x="10" y="100" font-family="monospace" font-size="9" fill="#334155">+assigned_to: str</text>
        <text x="10" y="114" font-family="monospace" font-size="9" fill="#334155">+investigator_notes: str</text>
        <line x1="0" y1="122" x2="230" y2="122" stroke="#e2e8f0" />
        <text x="10" y="138" font-family="monospace" font-size="9" fill="#64748b">+mark_resolved(decision, notes)</text>
    </g>

    <!-- Association Line: Transaction 1 <---> 0..1 Alert -->
    <line x1="600" y1="415" x2="660" y2="415" stroke="#475569" stroke-width="1.5" />
    <text x="608" y="407" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">1</text>
    <text x="635" y="407" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">0..1</text>
</svg>