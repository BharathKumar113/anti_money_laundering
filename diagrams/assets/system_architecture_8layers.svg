<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
    
    <defs>
        <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.08" />
        </filter>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="umlInh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
        </marker>
    </defs>

    <rect width="920" height="480" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="460" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Anti-Money Laundering Platform: System Architecture</text>
    <text x="460" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">High-level interaction between Client Layer, FastAPI Backend, 5 ML Detection Engines, and Persistence</text>

    <!-- 1. Client Layer -->
    <g transform="translate(30, 80)">
        <rect width="180" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <rect width="180" height="36" rx="8" fill="#2563eb" />
        <text x="90" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Client Layer</text>

        <!-- Sub box 1 -->
        <rect x="15" y="55" width="150" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">React 18 SPA</text>
        <text x="90" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Vis-Network Graph</text>
        <text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Chart.js KPI Dashboard</text>

        <!-- Sub box 2 -->
        <rect x="15" y="150" width="150" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <text x="90" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Banking Core</text>
        <text x="90" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">REST Payment Stream</text>
        <text x="90" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">JSON Transactions</text>

        <!-- Sub box 3 -->
        <rect x="15" y="245" width="150" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <text x="90" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Swagger Docs</text>
        <text x="90" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">OpenAPI at /docs</text>
        <text x="90" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Interactive API Tests</text>
    </g>

    <!-- Arrow Client -> Backend -->
    <path d="M 210 240 L 255 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" />
    <path d="M 255 260 L 210 260" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowSlate)" />

    <!-- 2. Backend Server Box -->
    <g transform="translate(265, 80)">
        <rect width="410" height="350" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" />
        <rect width="410" height="36" rx="8" fill="#1e293b" />
        <text x="205" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">FastAPI Application Server (Python 3.11)</text>

        <!-- Router & Middleware -->
        <rect x="20" y="48" width="370" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" />
        <text x="205" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">API Router Layer &amp; Pydantic v2 Schema Validation</text>

        <!-- Feature Transformer -->
        <rect x="20" y="94" width="370" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd" />
        <text x="205" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">9-Feature Contract Transformer (Balance Conservation Deltas)</text>

        <!-- 5 Model Detection Ensemble Container -->
        <g transform="translate(20, 138)">
            <rect width="370" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" />
            <text x="185" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Multi-Model Detection Ensemble (Concurrent Inference)</text>

            <!-- 5 mini boxes -->
            <rect x="10" y="28" width="64" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
            <text x="42" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">XGBoost</text>
            <text x="42" y="62" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Tree ML</text>

            <rect x="82" y="28" width="64" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
            <text x="114" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Autoenc.</text>
            <text x="114" y="62" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Deep MSE</text>

            <rect x="154" y="28" width="64" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
            <text x="186" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">IsoForest</text>
            <text x="186" y="62" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Outliers</text>

            <rect x="226" y="28" width="64" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
            <text x="258" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">NetworkX</text>
            <text x="258" y="62" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Graph Loop</text>

            <rect x="298" y="28" width="62" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
            <text x="329" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Rules</text>
            <text x="329" y="62" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Threshold</text>

            <!-- Fusion bar -->
            <rect x="10" y="84" width="350" height="26" rx="4" fill="#ecfdf5" stroke="#6ee7b7" />
            <text x="185" y="101" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46">Weighted Risk Score Fusion &amp; SHAP Explainability Engine</text>
        </g>

        <!-- Services Layer -->
        <rect x="20" y="268" width="370" height="68" rx="5" fill="#ffffff" stroke="#cbd5e1" />
        <text x="205" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Core Business Services</text>
        <text x="205" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">AMLService (Scoring &amp; Dispatch) • AlertService (Triage &amp; SAR) • GraphService</text>
        <text x="205" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">Average Synchronous Response Time: 11.20 ms</text>
    </g>

    <!-- Arrow Backend -> Database -->
    <path d="M 675 250 L 710 250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- 3. Persistence & Deployment -->
    <g transform="translate(720, 80)">
        <rect width="170" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <rect width="170" height="36" rx="8" fill="#059669" />
        <text x="85" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Persistence &amp; Cloud</text>

        <!-- Database -->
        <rect x="12" y="55" width="146" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <text x="85" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">PostgreSQL 16</text>
        <text x="85" y="98" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">SQLAlchemy 2.0 ORM</text>
        <text x="18" y="120" font-family="sans-serif" font-size="9" fill="#334155">• transactions table</text>
        <text x="18" y="136" font-family="sans-serif" font-size="9" fill="#334155">• alerts table</text>
        <text x="18" y="152" font-family="sans-serif" font-size="9" fill="#334155">• plugin_configs</text>

        <!-- Cloud Deploy -->
        <rect x="12" y="180" width="146" height="145" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <text x="85" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Render Cloud</text>
        <text x="85" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Docker Multi-Stage</text>
        <text x="18" y="248" font-family="sans-serif" font-size="9" fill="#334155">• Node 20 (Build SPA)</text>
        <text x="18" y="264" font-family="sans-serif" font-size="9" fill="#334155">• Python 3.11-slim</text>
        <text x="18" y="280" font-family="sans-serif" font-size="9" fill="#334155">• libgomp1 OpenMP</text>
        <text x="18" y="306" font-family="sans-serif" font-size="9" font-weight="700" fill="#059669">Live: onrender.com</text>
    </g>

    <!-- Bottom Legend -->
    <rect x="30" y="445" width="860" height="24" rx="4" fill="#f1f5f9" />
    <text x="460" y="461" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Production Architecture: Sub-15ms Ingestion • 14/14 Pytest Test Coverage • 0.942 AUC-ROC</text>
</svg>