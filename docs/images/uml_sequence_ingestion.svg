<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
    </defs>

    <rect width="980" height="540" rx="12" fill="#0f172a" />
    <text x="490" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">UML Sequence Diagram: Transaction Ingestion &amp; Scoring</text>
    <text x="490" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Execution tracing from client API call to parallel inference, alert generation &amp; persistence</text>

    <!-- Lifeline Headers -->
    <!-- Col 1: Banking Core -->
    <rect x="50" y="80" width="120" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <text x="110" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Banking Core</text>
    <line x1="110" y1="116" x2="110" y2="480" stroke="#475569" stroke-dasharray="4 4" />

    <!-- Col 2: FastAPI Router -->
    <rect x="230" y="80" width="120" height="36" rx="6" fill="#1e293b" stroke="#0ea5e9" />
    <text x="290" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">FastAPI Router</text>
    <line x1="290" y1="116" x2="290" y2="480" stroke="#475569" stroke-dasharray="4 4" />

    <!-- Col 3: AML Service -->
    <rect x="410" y="80" width="120" height="36" rx="6" fill="#1e293b" stroke="#8b5cf6" />
    <text x="470" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">AML Service</text>
    <line x1="470" y1="116" x2="470" y2="480" stroke="#475569" stroke-dasharray="4 4" />

    <!-- Col 4: ML Registry / 5 Engines -->
    <rect x="590" y="80" width="140" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" />
    <text x="660" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">5-Model Ensemble</text>
    <line x1="660" y1="116" x2="660" y2="480" stroke="#475569" stroke-dasharray="4 4" />

    <!-- Col 5: Database -->
    <rect x="790" y="80" width="120" height="36" rx="6" fill="#1e293b" stroke="#10b981" />
    <text x="850" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">PostgreSQL DB</text>
    <line x1="850" y1="116" x2="850" y2="480" stroke="#475569" stroke-dasharray="4 4" />

    <!-- Step 1: POST -->
    <line x1="110" y1="145" x2="285" y2="145" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="195" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">1. POST /transactions (JSON)</text>

    <!-- Step 2: Validate & Transform -->
    <line x1="290" y1="175" x2="465" y2="175" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow)" />
    <text x="377" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7dd3fc">2. process_and_save_tx()</text>

    <!-- Self Step: 9 Features -->
    <path d="M 470 190 L 510 190 L 510 210 L 475 210" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="545" y="205" font-family="system-ui, sans-serif" font-size="9" fill="#c084fc">3. Transform 9 features</text>

    <!-- Step 4: Dispatch to Ensemble -->
    <line x1="470" y1="235" x2="655" y2="235" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="562" y="227" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcd34d">4. execute_ensemble(x)</text>

    <!-- Parallel Box in Ensemble -->
    <rect x="610" y="250" width="100" height="95" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="3 3" />
    <text x="660" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• XGBoost (2ms)</text>
    <text x="660" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Autoencoder (7ms)</text>
    <text x="660" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• IsoForest (110ms)</text>
    <text x="660" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Graph Ring (&lt;1ms)</text>
    <text x="660" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Rules (&lt;1ms)</text>

    <!-- Step 5: Return Ensemble Result -->
    <line x1="660" y1="360" x2="475" y2="360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <text x="562" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcd34d">5. Return Score (0.8711, HIGH)</text>

    <!-- Step 6: Insert into DB -->
    <line x1="470" y1="390" x2="845" y2="390" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
    <text x="657" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">6. INSERT transactions &amp; alerts (Status: PENDING)</text>

    <!-- Step 7: DB Return -->
    <line x1="850" y1="415" x2="475" y2="415" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <text x="660" y="407" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">7. Record Saved Confirmation</text>

    <!-- Step 8: Return Response -->
    <line x1="470" y1="440" x2="295" y2="440" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <text x="382" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7dd3fc">8. Enriched Response</text>

    <!-- Step 9: 201 Created to Client -->
    <line x1="290" y1="465" x2="115" y2="465" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <text x="202" y="457" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">9. 201 Created (JSON Payload with SHAP)</text>
</svg>