<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
    </defs>

    <rect width="960" height="420" rx="12" fill="#0f172a" />
    <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">UML State Machine Diagram: Compliance Alert Lifecycle</text>
    <text x="480" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">State transitions from automated alert creation to forensic investigation and regulatory SAR filing</text>

    <!-- Start Node -->
    <circle cx="80" cy="190" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />

    <!-- Ingested State -->
    <g transform="translate(130, 160)">
        <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="65" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ingested</text>
    </g>
    <line x1="94" y1="190" x2="125" y2="190" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Low Risk -> Cleared State -->
    <path d="M 195 160 L 195 105 L 340 105" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
    <text x="250" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">Score &lt; 0.40 (LOW)</text>

    <g transform="translate(345, 80)">
        <rect width="130" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <text x="65" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CLEARED</text>
    </g>
    <!-- End Node 1 -->
    <circle cx="530" cy="105" r="14" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <circle cx="530" cy="105" r="8" fill="#10b981" />
    <line x1="475" y1="105" x2="512" y2="105" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Suspicious -> Pending Alert State -->
    <path d="M 260 190 L 340 190" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="300" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcd34d">Score &gt;= 0.40</text>

    <g transform="translate(345, 160)" filter="url(#dropShadow)">
        <rect width="150" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <text x="75" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">PENDING_ALERT</text>
        <text x="75" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Severity: HIGH / MED</text>
    </g>

    <!-- Claim -> Under Investigation -->
    <line x1="495" y1="190" x2="555" y2="190" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="525" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Claim</text>

    <g transform="translate(560, 160)" filter="url(#dropShadow)">
        <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
        <text x="85" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">INVESTIGATION</text>
        <text x="85" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Inspect SHAP &amp; Graph</text>
    </g>

    <!-- Branch from Investigation -->
    <!-- Branch 1: False Positive -->
    <path d="M 645 220 L 645 290 L 770 290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />
    <text x="705" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Benign Commerce</text>

    <g transform="translate(775, 265)">
        <rect width="135" height="50" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
        <text x="67" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">DISMISSED</text>
    </g>

    <!-- Branch 2: Confirmed Fraud / SAR Filed -->
    <path d="M 730 190 L 770 190" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />
    <text x="750" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Laundering</text>

    <g transform="translate(775, 160)" filter="url(#dropShadow)">
        <rect width="135" height="60" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
        <text x="67" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">SAR_FILED</text>
        <text x="67" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fecaca">Sent to Gov FIU</text>
    </g>
</svg>