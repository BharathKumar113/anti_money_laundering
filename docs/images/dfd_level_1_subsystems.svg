<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620">
    <defs>
        <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.08" />
        </filter>
        <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
        <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
        <marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
        </marker>
    </defs>

    <!-- Canvas -->
    <rect width="1020" height="620" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="510" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Data Flow Diagram (DFD) — Level 1 Subsystem Architecture</text>
    <text x="510" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Decomposition into 5 functional processes, shared data stores, and bi-directional entity pipelines</text>

    <!-- EXTERNAL ENTITIES -->
    <!-- Banking Core -->
    <g transform="translate(30, 100)" class="interactive-node">
        <rect width="140" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8" filter="url(#shadow1)" />
        <rect width="140" height="22" rx="6" fill="#334155" />
        <text x="70" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">EXTERNAL ENTITY</text>
        <text x="70" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Core Banking</text>
        <text x="70" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">Payments Stream</text>
    </g>

    <!-- Compliance Officer -->
    <g transform="translate(30, 480)" class="interactive-node">
        <rect width="140" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8" filter="url(#shadow1)" />
        <rect width="140" height="22" rx="6" fill="#334155" />
        <text x="70" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">EXTERNAL ENTITY</text>
        <text x="70" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">AML Analyst</text>
        <text x="70" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#059669">Web UI Dashboard</text>
    </g>

    <!-- FinCEN / BSA -->
    <g transform="translate(850, 480)" class="interactive-node">
        <rect width="140" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8" filter="url(#shadow1)" />
        <rect width="140" height="22" rx="6" fill="#334155" />
        <text x="70" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">EXTERNAL ENTITY</text>
        <text x="70" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">FinCEN Gateway</text>
        <text x="70" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#dc2626">BSA Electronic Filing</text>
    </g>

    <!-- PROCESS 1.0: Ingestion & Validation -->
    <g transform="translate(240, 95)" class="interactive-node">
        <rect width="190" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow1)" />
        <text x="95" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb">PROCESS 1.0</text>
        <text x="95" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Ingestion &amp; Schema</text>
        <text x="95" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Pydantic v2 Parsing &amp; Auth</text>
    </g>

    <!-- PROCESS 2.0: Multi-Model Scoring Engine -->
    <g transform="translate(520, 95)" class="interactive-node">
        <rect width="210" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow1)" />
        <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed">PROCESS 2.0</text>
        <text x="105" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Hybrid Model Scorer</text>
        <text x="105" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">XGB + IF + AE + Rules</text>
    </g>

    <!-- PROCESS 3.0: Graph Network Forensics -->
    <g transform="translate(800, 95)" class="interactive-node">
        <rect width="190" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow1)" />
        <text x="95" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">PROCESS 3.0</text>
        <text x="95" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Network Forensics</text>
        <text x="95" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Cycle &amp; Mule Ring Detector</text>
    </g>

    <!-- PROCESS 4.0: Alert Engine & Case Manager -->
    <g transform="translate(240, 475)" class="interactive-node">
        <rect width="200" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow1)" />
        <text x="100" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#d97706">PROCESS 4.0</text>
        <text x="100" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Alerts &amp; Case Mgmt</text>
        <text x="100" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Risk Priority, Review Queue</text>
    </g>

    <!-- PROCESS 5.0: Audit Trail & SAR Filing -->
    <g transform="translate(560, 475)" class="interactive-node">
        <rect width="200" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow1)" />
        <text x="100" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">PROCESS 5.0</text>
        <text x="100" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Audit &amp; SAR Dispatch</text>
        <text x="100" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">FinCEN XML Generation</text>
    </g>

    <!-- DATA STORES (Parallel Line Rectangles) -->
    <!-- D1: Raw Transactions Store -->
    <g transform="translate(220, 270)" class="interactive-node">
        <rect width="180" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="260" y1="270" x2="260" y2="320" stroke="#94a3b8" stroke-width="1.5" />
        <text x="240" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">D1</text>
        <text x="325" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Transaction Store</text>
        <text x="325" y="308" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Raw PaySim Ledgers</text>
    </g>

    <!-- D2: Feature & State Cache -->
    <g transform="translate(450, 270)" class="interactive-node">
        <rect width="180" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="490" y1="270" x2="490" y2="320" stroke="#94a3b8" stroke-width="1.5" />
        <text x="470" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">D2</text>
        <text x="555" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Entity Feature Cache</text>
        <text x="555" y="308" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Balances, Velocity Windows</text>
    </g>

    <!-- D3: AML Alerts Store -->
    <g transform="translate(680, 270)" class="interactive-node">
        <rect width="180" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="720" y1="270" x2="720" y2="320" stroke="#94a3b8" stroke-width="1.5" />
        <text x="700" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">D3</text>
        <text x="785" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Alerts &amp; SAR Cases</text>
        <text x="785" y="308" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">SQLite / Postgres DB</text>
    </g>

    <!-- CONNECTING FLOWS -->
    <!-- 1. Banking -> Process 1.0 -->
    <path d="M 170 135 L 240 135" stroke="#2563eb" stroke-width="2" marker-end="url(#mBlue)" />
    <!-- 2. Process 1.0 -> D1 -->
    <path d="M 310 175 L 310 270" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mBlue)" />
    <!-- 3. Process 1.0 -> Process 2.0 -->
    <path d="M 430 135 L 520 135" stroke="#2563eb" stroke-width="2" marker-end="url(#mBlue)" />
    <!-- 4. D2 <-> Process 2.0 -->
    <path d="M 540 270 L 540 175" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#mPurple)" />
    <!-- 5. Process 2.0 -> Process 3.0 -->
    <path d="M 730 135 L 800 135" stroke="#059669" stroke-width="2" marker-end="url(#mGreen)" />
    <!-- 6. Process 3.0 -> D3 -->
    <path d="M 860 175 L 860 220 L 770 220 L 770 270" stroke="#059669" stroke-width="1.8" marker-end="url(#mGreen)" />
    <!-- 7. Process 2.0 -> D3 -->
    <path d="M 640 175 L 640 220 L 710 220 L 710 270" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#mPurple)" />
    <!-- 8. D3 -> Process 4.0 -->
    <path d="M 680 295 L 340 295 L 340 475" stroke="#d97706" stroke-width="1.8" marker-end="url(#mAmber)" />
    <!-- 9. Process 4.0 <-> Analyst -->
    <path d="M 240 500 L 170 500" stroke="#059669" stroke-width="2" marker-end="url(#mGreen)" />
    <path d="M 170 530 L 240 530" stroke="#334155" stroke-width="1.8" marker-end="url(#mBlue)" />
    <!-- 10. Process 4.0 -> Process 5.0 -->
    <path d="M 440 515 L 560 515" stroke="#dc2626" stroke-width="2" marker-end="url(#mAmber)" />
    <!-- 11. Process 5.0 -> FinCEN -->
    <path d="M 760 515 L 850 515" stroke="#dc2626" stroke-width="2" marker-end="url(#mAmber)" />
</svg>