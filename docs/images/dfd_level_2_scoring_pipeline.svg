<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="1060" height="620">
    <defs>
        <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.08" />
        </filter>
        <marker id="m2Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
        <marker id="m2Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
    </defs>

    <rect width="1060" height="620" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="530" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Data Flow Diagram (DFD) — Level 2 Ingestion &amp; 5-Model Scoring Pipeline</text>
    <text x="530" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Detailed algorithmic data flow from raw PaySim payload through 5 concurrent engines to calibrated risk score</text>

    <!-- Step 2.1: Ingestion & Feature Engineering -->
    <g transform="translate(30, 240)" class="interactive-node">
        <rect width="160" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow2)" />
        <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb">SUB-PROCESS 2.1</text>
        <text x="80" y="46" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Feature Vectorizer</text>
        <text x="80" y="66" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Delta Balance Diff</text>
        <text x="80" y="82" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Rolling Velocity Log</text>
    </g>

    <!-- 5 Concurrent Detection Engines in parallel stack -->
    <!-- 2.2 Rule Engine -->
    <g transform="translate(260, 80)" class="interactive-node">
        <rect width="210" height="74" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow2)" />
        <rect width="210" height="20" rx="8" fill="#334155" />
        <text x="105" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">ENGINE 1: DETERMINISTIC RULES</text>
        <text x="105" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Rule Evaluator</text>
        <text x="105" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">Amount &gt; $10k, Structuring</text>
    </g>

    <!-- 2.3 XGBoost Scorer -->
    <g transform="translate(260, 180)" class="interactive-node">
        <rect width="210" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow2)" />
        <rect width="210" height="20" rx="8" fill="#2563eb" />
        <text x="105" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">ENGINE 2: SUPERVISED BOOSTING</text>
        <text x="105" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">XGBoost Classifier</text>
        <text x="105" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">18 Engineered Features</text>
    </g>

    <!-- 2.4 Isolation Forest Scorer -->
    <g transform="translate(260, 280)" class="interactive-node">
        <rect width="210" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" filter="url(#shadow2)" />
        <rect width="210" height="20" rx="8" fill="#059669" />
        <text x="105" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">ENGINE 3: SPATIAL ANOMALY</text>
        <text x="105" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Isolation Forest</text>
        <text x="105" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">Hyperplane Partition Score</text>
    </g>

    <!-- 2.5 PyTorch Autoencoder -->
    <g transform="translate(260, 380)" class="interactive-node">
        <rect width="210" height="74" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow2)" />
        <rect width="210" height="20" rx="8" fill="#7c3aed" />
        <text x="105" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">ENGINE 4: DEEP RECONSTRUCTION</text>
        <text x="105" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">PyTorch Autoencoder</text>
        <text x="105" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">MSE Latent Bottleneck Error</text>
    </g>

    <!-- 2.6 Graph Forensics -->
    <g transform="translate(260, 480)" class="interactive-node">
        <rect width="210" height="74" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" filter="url(#shadow2)" />
        <rect width="210" height="20" rx="8" fill="#d97706" />
        <text x="105" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">ENGINE 5: TOPOLOGY / GRAPH</text>
        <text x="105" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">NetworkX Forensics</text>
        <text x="105" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">Cycle Finding, In/Out-degree</text>
    </g>

    <!-- Sub-process 2.7: Ensemble Aggregator & Calibrator -->
    <g transform="translate(560, 230)" class="interactive-node">
        <rect width="200" height="120" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="2" filter="url(#shadow2)" />
        <rect width="200" height="24" rx="10" fill="#0f172a" />
        <text x="100" y="16" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">SUB-PROCESS 2.7</text>
        <text x="100" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">Meta-Ensemble Scorer</text>
        <text x="100" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Weighted Blending (α, β, γ)</text>
        <text x="100" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Sigmoid Probability Map</text>
        <text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">Calibrated Score: 0 - 100</text>
    </g>

    <!-- Decision Gate: Threshold T >= 70 -->
    <g transform="translate(830, 240)" class="interactive-node">
        <polygon points="70,0 140,50 70,100 0,50" fill="#fff" stroke="#dc2626" stroke-width="2" filter="url(#shadow2)" />
        <text x="70" y="46" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">Risk &gt;= 70 ?</text>
        <text x="70" y="62" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">Threshold Gate</text>
    </g>

    <!-- Output: Suspicious Activity Report (SAR) -->
    <g transform="translate(820, 70)" class="interactive-node">
        <rect width="160" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow2)" />
        <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">CRITICAL ACTION</text>
        <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#991b1b">Generate SAR Alert</text>
        <text x="80" y="60" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">Hold Account + Dispatch</text>
    </g>

    <!-- Output: Normal Cleared Transaction -->
    <g transform="translate(820, 460)" class="interactive-node">
        <rect width="160" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow2)" />
        <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">BENIGN ACTION</text>
        <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#065f46">Clear Transaction</text>
        <text x="80" y="60" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#059669">Settle to Ledger</text>
    </g>

    <!-- Fan-out routing paths from 2.1 to 5 engines -->
    <path d="M 190 290 L 225 290 L 225 117 L 260 117" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 190 290 L 225 290 L 225 217 L 260 217" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 190 290 L 260 290" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 190 290 L 225 290 L 225 417 L 260 417" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 190 290 L 225 290 L 225 517 L 260 517" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />

    <!-- Fan-in routing paths from 5 engines to 2.7 -->
    <path d="M 470 117 L 515 117 L 515 290 L 560 290" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 470 217 L 515 217 L 515 290 L 560 290" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 470 317 L 560 317" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 470 417 L 515 417 L 515 290 L 560 290" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />
    <path d="M 470 517 L 515 517 L 515 290 L 560 290" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#m2Blue)" />

    <!-- 2.7 to Decision Gate -->
    <path d="M 760 290 L 830 290" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#m2Blue)" />

    <!-- Decision Gate YES -> SAR -->
    <path d="M 900 240 L 900 140" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#m2Red)" />
    <text x="912" y="195" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">YES (Risk ≥ 70)</text>

    <!-- Decision Gate NO -> Clear -->
    <path d="M 900 340 L 900 460" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#m2Blue)" />
    <text x="912" y="395" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">NO (Risk &lt; 70)</text>
</svg>