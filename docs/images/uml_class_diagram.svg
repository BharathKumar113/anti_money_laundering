<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#6d28d9" />
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
        </marker>
    </defs>

    <rect width="1000" height="680" rx="12" fill="#0f172a" />
    <text x="500" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">UML Class Diagram: Plugin Architecture &amp; Domain Entities</text>
    <text x="500" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Object-oriented class hierarchy, plugin registry pattern, and persistence models</text>

    <!-- Base Abstract Class: BaseAMLModelPlugin -->
    <g transform="translate(360, 80)" filter="url(#dropShadow)">
        <rect width="280" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <rect width="280" height="30" rx="8" fill="#0284c7" />
        <text x="140" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">&lt;&lt;abstract&gt;&gt; BaseAMLModelPlugin</text>
        <text x="15" y="48" font-family="monospace" font-size="10" fill="#cbd5e1">+str name, version, author</text>
        <text x="15" y="64" font-family="monospace" font-size="10" fill="#cbd5e1">+ModelType model_type</text>
        <text x="15" y="80" font-family="monospace" font-size="10" fill="#cbd5e1">+bool is_enabled</text>
        <text x="15" y="96" font-family="monospace" font-size="10" fill="#cbd5e1">+float weight</text>
        <line x1="10" y1="105" x2="270" y2="105" stroke="#334155" />
        <text x="15" y="122" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8">+predict(tx: dict): PluginPrediction*</text>
        <text x="15" y="138" font-family="monospace" font-size="10" fill="#94a3b8">#_track_latency(t0: float): float</text>
    </g>

    <!-- Concrete Plugin 1: Heuristic -->
    <g transform="translate(40, 280)">
        <rect width="170" height="85" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
        <rect width="170" height="24" rx="6" fill="#334155" />
        <text x="85" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">HeuristicRulePlugin</text>
        <text x="10" y="42" font-family="monospace" font-size="9" fill="#94a3b8">weight = 0.50</text>
        <line x1="5" y1="48" x2="165" y2="48" stroke="#334155" />
        <text x="10" y="65" font-family="monospace" font-size="9" fill="#cbd5e1">+predict(tx)</text>
    </g>

    <!-- Concrete Plugin 2: XGBoost -->
    <g transform="translate(230, 280)">
        <rect width="170" height="85" rx="6" fill="#1e293b" stroke="#2563eb" stroke-width="2" />
        <rect width="170" height="24" rx="6" fill="#1d4ed8" />
        <text x="85" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">XGBoostPlugin</text>
        <text x="10" y="42" font-family="monospace" font-size="9" fill="#93c5fd">+Booster loaded_model</text>
        <line x1="5" y1="48" x2="165" y2="48" stroke="#334155" />
        <text x="10" y="65" font-family="monospace" font-size="9" fill="#cbd5e1">+predict(tx)</text>
        <text x="10" y="78" font-family="monospace" font-size="9" fill="#94a3b8">-_try_load_model()</text>
    </g>

    <!-- Concrete Plugin 3: IsolationForest -->
    <g transform="translate(420, 280)">
        <rect width="170" height="85" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" />
        <rect width="170" height="24" rx="6" fill="#6d28d9" />
        <text x="85" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">IsolationForestPlugin</text>
        <text x="10" y="42" font-family="monospace" font-size="9" fill="#c084fc">+IsolationForest loaded</text>
        <line x1="5" y1="48" x2="165" y2="48" stroke="#334155" />
        <text x="10" y="65" font-family="monospace" font-size="9" fill="#cbd5e1">+predict(tx)</text>
    </g>

    <!-- Concrete Plugin 4: Autoencoder -->
    <g transform="translate(610, 280)">
        <rect width="170" height="85" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1.5" />
        <rect width="170" height="24" rx="6" fill="#b45309" />
        <text x="85" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">AutoencoderPlugin</text>
        <text x="10" y="42" font-family="monospace" font-size="9" fill="#fcd34d">+dict loaded_bundle</text>
        <line x1="5" y1="48" x2="165" y2="48" stroke="#334155" />
        <text x="10" y="65" font-family="monospace" font-size="9" fill="#cbd5e1">+predict(tx)</text>
    </g>

    <!-- Concrete Plugin 5: GraphRing -->
    <g transform="translate(800, 280)">
        <rect width="160" height="85" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
        <rect width="160" height="24" rx="6" fill="#047857" />
        <text x="80" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">GraphRingPlugin</text>
        <text x="10" y="42" font-family="monospace" font-size="9" fill="#6ee7b7">weight = 0.90</text>
        <line x1="5" y1="48" x2="155" y2="48" stroke="#334155" />
        <text x="10" y="65" font-family="monospace" font-size="9" fill="#cbd5e1">+predict(tx)</text>
    </g>

    <!-- Inheritance connector lines -->
    <line x1="125" y1="280" x2="125" y2="250" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="315" y1="280" x2="315" y2="250" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="505" y1="280" x2="505" y2="250" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="695" y1="280" x2="695" y2="250" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="880" y1="280" x2="880" y2="250" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="125" y1="250" x2="880" y2="250" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="500" y1="250" x2="500" y2="230" stroke="#94a3b8" stroke-width="1.5" />

    <!-- ModelPluginRegistry -->
    <g transform="translate(40, 420)">
        <rect width="280" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <rect width="280" height="28" rx="8" fill="#0369a1" />
        <text x="140" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ModelPluginRegistry</text>
        <text x="15" y="48" font-family="monospace" font-size="10" fill="#cbd5e1">-dict _plugins</text>
        <line x1="10" y1="56" x2="270" y2="56" stroke="#334155" />
        <text x="15" y="74" font-family="monospace" font-size="10" fill="#cbd5e1">+register_plugin(plugin)</text>
        <text x="15" y="92" font-family="monospace" font-size="10" fill="#cbd5e1">+toggle_plugin(name, enabled)</text>
        <text x="15" y="110" font-family="monospace" font-size="10" fill="#cbd5e1">+update_weight(name, weight)</text>
        <text x="15" y="128" font-family="monospace" font-size="10" fill="#cbd5e1">+execute_ensemble(tx): Result</text>
    </g>

    <!-- Aggregation Line -->
    <line x1="320" y1="470" x2="400" y2="470" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="400" y1="470" x2="400" y2="230" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="320,470 330,465 340,470 330,475" fill="#ffffff" stroke="#94a3b8" />

    <!-- Transaction Entity -->
    <g transform="translate(380, 420)">
        <rect width="280" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
        <rect width="280" height="28" rx="8" fill="#047857" />
        <text x="140" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Transaction (SQLAlchemy)</text>
        <text x="15" y="46" font-family="monospace" font-size="10" fill="#cbd5e1">+str id (PK, UUID)</text>
        <text x="15" y="62" font-family="monospace" font-size="10" fill="#cbd5e1">+int step, str type</text>
        <text x="15" y="78" font-family="monospace" font-size="10" fill="#cbd5e1">+float amount</text>
        <text x="15" y="94" font-family="monospace" font-size="10" fill="#cbd5e1">+str name_orig, name_dest</text>
        <text x="15" y="110" font-family="monospace" font-size="10" fill="#cbd5e1">+float old_orig, new_orig</text>
        <text x="15" y="126" font-family="monospace" font-size="10" fill="#cbd5e1">+float old_dest, new_dest</text>
        <text x="15" y="142" font-family="monospace" font-size="10" fill="#cbd5e1">+float risk_score</text>
        <text x="15" y="158" font-family="monospace" font-size="10" fill="#cbd5e1">+bool is_suspicious</text>
        <text x="15" y="174" font-family="monospace" font-size="10" fill="#cbd5e1">+list flag_reasons</text>
        <text x="15" y="190" font-family="monospace" font-size="10" fill="#cbd5e1">+dict shap_values</text>
        <text x="15" y="206" font-family="monospace" font-size="10" fill="#cbd5e1">+datetime created_at</text>
    </g>

    <!-- Alert Entity -->
    <g transform="translate(720, 420)">
        <rect width="240" height="190" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
        <rect width="240" height="28" rx="8" fill="#b91c1c" />
        <text x="120" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Alert (SQLAlchemy)</text>
        <text x="15" y="46" font-family="monospace" font-size="10" fill="#cbd5e1">+int id (PK)</text>
        <text x="15" y="62" font-family="monospace" font-size="10" fill="#cbd5e1">+str transaction_id (FK)</text>
        <text x="15" y="78" font-family="monospace" font-size="10" fill="#cbd5e1">+float risk_score</text>
        <text x="15" y="94" font-family="monospace" font-size="10" fill="#cbd5e1">+str severity (HIGH/MED)</text>
        <text x="15" y="110" font-family="monospace" font-size="10" fill="#cbd5e1">+str status (PENDING/CONF)</text>
        <text x="15" y="126" font-family="monospace" font-size="10" fill="#cbd5e1">+str assigned_to</text>
        <text x="15" y="142" font-family="monospace" font-size="10" fill="#cbd5e1">+str investigator_notes</text>
        <text x="15" y="158" font-family="monospace" font-size="10" fill="#cbd5e1">+datetime created_at</text>
        <text x="15" y="174" font-family="monospace" font-size="10" fill="#cbd5e1">+datetime resolved_at</text>
    </g>

    <!-- Association 1 to 0..1 -->
    <line x1="660" y1="510" x2="720" y2="510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)" />
    <text x="670" y="500" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">1</text>
    <text x="700" y="500" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">0..1</text>
</svg>